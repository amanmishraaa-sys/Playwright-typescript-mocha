name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run tests on"
        required: true
        default: "all"
        type: choice
        options:
          - chromium
          - firefox
          - all

      test_path:
        description: "Test file or directory"
        required: false
        default: "all"
        type: choice
        options:
          - src/tests/loginPractice
          - src/tests/automation
          - src/tests/clientLogin
          - src/tests/uploadAndDownload
          - all

      workers:
        description: "Number of parallel workers"
        required: false
        default: "2"
        type: number

      grep:
        description: "Run tests with this tag"
        required: false
        default: ""
        type: string

      retries:
        description: "Number of retries"
        required: false
        default: "1"
        type: number

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    
      env:
        BROWSER: ${{ inputs.browser || 'all' }}
        TEST_PATH: ${{ inputs.test_path || 'all' }}
        WORKERS: ${{ inputs.workers || '6' }}
        GREP: ${{ inputs.grep || '' }}
        RETRIES: ${{ inputs.retries || '1' }}

    - name: Install dependencies
      run: npm ci

    - name: Install the required Playwright Browser
      shell: bash
      run: |
        if [ "$BROWSER" = "all" ]; then
          npx playwright install --with-deps
        else
          npx playwright install "$BROWSER" --with-deps
        fi

    - name: Run Playwright tests
      shell: pwsh
      run: |
        $testCommand = "npx playwright test"

        # Test Directory selection
        if ($env.TEST_PATH -ne "all"){
          $testCommand += " `"$env.TEST_PATH`""
        }

        # Browser selection
        if ($env.BROWSER -ne "all") {
          $testCommand += " --project=`"$env.BROWSER`""
        }

        # Tag selection
        if ($env.GREP -ne "") {
          $testCommand += " --grep=`"$env.GREP`""
        }

        # Workers and retries
        $testCommand += " --workers=`"$env.WORKERS`""
        $testCommand += " --retries=`"$env.RETRIES`""

        Write-Host "Executing: $testCommand"
        Invoke-Expression $testCommand

    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
