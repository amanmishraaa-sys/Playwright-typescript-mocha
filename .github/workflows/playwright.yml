name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run tests on"
        required: true
        default: "all"
        type: choice
        options:
          - chromium
          - firefox
          - all

      test_path:
        description: "Test file or directory"
        required: false
        default: "all"
        type: choice
        options:
          - src/tests/loginPractice
          - src/tests/automation
          - src/tests/clientLogin
          - src/tests/uploadAndDownload
          - all

      workers:
        description: "Number of parallel workers"
        required: false
        default: "6"
        type: number

      grep:
        description: "Run tests with this tag"
        required: false
        default: ""
        type: string

      retries:
        description: "Number of retries"
        required: false
        default: "1"
        type: number


jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        shell: bash
        run: |
          if [ "${{ inputs.browser || 'all' }}" = "all" ]; then
            npx playwright install --with-deps
          else
            npx playwright install "${{ inputs.browser }}" --with-deps
          fi

      - name: Run Playwright tests
        shell: pwsh
        env:
          BROWSER: ${{ inputs.browser || 'all' }}
          TEST_PATH: ${{ inputs.test_path || 'all' }}
          WORKERS: ${{ inputs.workers || '6' }}
          GREP: ${{ inputs.grep || '' }}
          RETRIES: ${{ inputs.retries || '1' }}

        run: |
          $testCommand = "npx playwright test"

          # Test path
          if ($env:TEST_PATH -ne "all") {
            $testCommand += " `"$env:TEST_PATH`""
          }

          # Browser
          # If browser is "all", don't pass --project.
          # Playwright will run all configured projects.
          if ($env:BROWSER -ne "all") {
            $testCommand += " --project=`"$env:BROWSER`""
          }

          # Grep / Tag
          if ($env:GREP -ne "") {
            $testCommand += " --grep=`"$env:GREP`""
          }

          # Workers
          $testCommand += " --workers=`"$env:WORKERS`""

          # Retries
          $testCommand += " --retries=`"$env:RETRIES`""

          Write-Host "Executing: $testCommand"

          Invoke-Expression $testCommand

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7